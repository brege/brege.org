baseURL = "https://brege.org"
copyright = "Copyright (c) 2016-2026 Wyatt Brege"
locale = "en"
defaultContentLanguage = "en"
enableRobotsTXT = true
enableInlineShortcodes = true
enableEmoji = true
ignoreFiles = ['(?:^|/)README\.md$']
theme = "gastrophysics"
title = "brege.org"

[frontmatter]
  lastmod = ["lastmod", ":fileModTime"]

[outputs]
  home = [ "HTML", "RSS", "JSON", "LLMS", "LLMSFull" ]

[mediaTypes."text/markdown"]
  suffixes = [ "md" ]

[outputFormats.CVMarkdown]
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true
  notAlternative = false
  rel = "alternate"
  ugly = true

[outputFormats.PageMarkdown]
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true
  notAlternative = false
  rel = "alternate"
  ugly = true

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = false
  rel = "alternate"

[outputFormats.LLMSFull]
  mediaType = "text/plain"
  baseName = "llms-full"
  isPlainText = true
  notAlternative = false
  rel = "alternate"

# needed to render raw HTML such as sub, sup, kbd, and mark
[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[markup.tableOfContents]
  ordered = true
  startLevel = 1
  endLevel = 4

[[menus.main]]
  identifier = "search"
  name = "search"
  url = "/search"
  weight = 5
[[menus.main]]
  identifier = "about"
  name = "about"
  url = "/about"
  weight = 10
[[menus.main]]
  identifier = "post"
  name = "posts"
  url = "/post"
  weight = 20
[[menus.main]]
  identifier = "recipes"
  name = "recipes"
  url = "/recipes"
  weight = 25
[[menus.main]]
  identifier = "contact"
  name = "contact"
  url = "/contact"
  weight = 30
[[menus.main]]
  identifier = "cv"
  name = "resumé"
  url = "/cv"
  weight = 40

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[privacy.vimeo]
  disabled = false
  simple = true

[privacy.x]
  disabled = false
  enableDNT = true
  simple = true

[privacy.instagram]
  disabled = false
  simple = true

[privacy.youtube]
  disabled = false
  privacyEnhanced = true

[services.instagram]
  disableInlineCSS = true

[services.x]
  disableInlineCSS = true

[pagination]
  pagerSize = 20

[caches.getresource]
  maxAge = "10m"
