  - title: Selected Work
    handler: projects
    items:
      - name: monitorat
        url: https://monitorat.brege.org
        summary: >-
          is a federated, continuous dashboard and documentation framework
          for Linux homelabs with a themeable and extensible widget system.
        stack: python, flask, javascript, html, css, yaml, docker, systemd, widgets, csv, homelab, pypi
        links:
          - label: Demo
            url: https://monitorat.brege.org
          - label: Source
            url: https://github.com/brege/monitorat
          - label: PyPI
            url: https://pypi.org/project/monitorat/
          - label: Docker
            url: https://hub.docker.com/r/brege/monitorat

      - name: oshea
        url: https://github.com/brege/oshea
        summary: >-
          is a Node.js Markdown-to-PDF document plugin framework featuring
          archetyping, Claude Code Skills, YAML workflows, and multi-level QA suite.
        stack: node.js, yargs, puppeteer, markdown-it, js-yaml, ajv, plugins, archetypes, docs, recipes, books, cover letters
        links:
          - label: Source
            url: https://github.com/brege/oshea
          - label: npm
            url: https://www.npmjs.com/package/oshea
          - label: Docs
            url: https://github.com/brege/oshea/tree/main/docs
          - label: Plugins
            url: https://github.com/brege/oshea-plugins
          - label: Agents
            url: https://github.com/brege/oshea/blob/main/docs/guides/claude-skills.md

      - name: "br\u016Bki"
        url: https://github.com/brege/bruki
        summary: >-
          is a self-hosted screenshot tagger, sorter, and retrieval app using
          machine learning via OCR, CLIP, and VLM image processing.
        stack: python, flask, sqlite, pandas, numpy, pillow, pytesseract, pydantic, pytorch, clip, umap, hdbscan
        links:
          - label: Source
            url: https://github.com/brege/bruki
          - label: Notebooks
            url: https://github.com/brege/bruki/tree/main/notebooks

      - name: the-flavor-network
        url: https://flavorpair.me
        summary: >-
          is an interactive flavor-pairing and recipe-discovery tool built from
          well-respected culinary texts, a large recipe corpus, and featuring
          network graphs built on a weighted Jaccard similarity algorithm.
        stack: hugo, papermod, javascript, vis.js, fuse.js, flask, sqlite, uwsgi, nginx, systemd, recipes, data science
        links:
          - label: Website
            url: https://flavorpair.me
          - label: Core
            url: https://github.com/brege/flavor-project
          - label: Source
            url: https://github.com/brege/the-flavor-network

      - name: aoife
        url: https://aoife.brege.org
        summary: >-
          is a mixed-media poster matrix engine integrating a dozen APIs for
          collage building, cover-art search, and artwork discovery.
        stack: react, typescript, vite, flask, python, websocket, zustand, tmdb, openlibrary, musicbrainz, cypress, biome
        links:
          - label: Demo
            url: https://aoife.brege.org
          - label: Source
            url: https://github.com/brege/aoife

    note: "See [github.com/brege](https://github.com/brege) for a complete list of software projects."

