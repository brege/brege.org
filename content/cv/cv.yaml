  - title: Research Experience
    handler: research
    items:
      - date: "May 2013 | to | Sep 2018"
        title: "Black hole-neutron star mergers and accretion disk simulations"
        meta: "[Physics Dissertation](https://hdl.handle.net/2376/111818), [Washington State University](https://physics.wsu.edu), [SXS collaboration](https://black-holes.org)"
        content:
          - >-
            I evolved [black hole](https://en.wikipedia.org/wiki/Black_hole)-[neutron star](https://en.wikipedia.org/wiki/Neutron_star) systems
            in [SpEC](https://www.black-holes.org/code/SpEC.html) with [adaptive mesh refinement](https://en.wikipedia.org/wiki/Adaptive_mesh_refinement)
            and [nuclear-theory](https://en.wikipedia.org/wiki/Nucleosynthesis) based [equations of state](https://en.wikipedia.org/wiki/Equation_of_state).
          - >-
            I implemented a shock-capturing, energy stable, multiblock algorithm,
            [ESWENO](https://arc.aiaa.org/doi/abs/10.2514/6.2012-2837), into [SpEC](https://www.black-holes.org/code/SpEC.html) to solve the
            [fluid equations](https://en.wikipedia.org/wiki/Computational_fluid_dynamics) of an
            [accretion disk](https://en.wikipedia.org/wiki/Accretion_disk) on a multipatch grid structure.

      - date: "May 2010 | to | Aug 2010"
        title: "Generalized uncertainty principle"
        meta: "[Post-baccalaureate Research](https://physics.gvsu.edu), [Grand Valley State University](https://physics.gvsu.edu)"
        content:
          - >-
            I explored numerous algebras connecting [polymer quantum mechanics](https://en.wikipedia.org/wiki/Loop_quantum_gravity)
            and [minimal length](https://en.wikipedia.org/wiki/Uncertainty_principle).

      - date: "Aug 2009 | to | May 2010"
        title: "Motion in two-center gravitational systems"
        meta: "[Physics Senior Thesis](https://physics.gvsu.edu), [Grand Valley State University](https://physics.gvsu.edu)"
        content:
          - >-
            A [three-body problem](https://en.wikipedia.org/wiki/Three-body_problem) where I evolved
            [Hamilton's equations](https://en.wikipedia.org/wiki/Hamiltonian_mechanics) using
            [Gragg extrapolation](https://en.wikipedia.org/wiki/Bulirsch%E2%80%93Stoer_algorithm) to model
            [chaotic](https://en.wikipedia.org/wiki/Chaos_theory) [particle trajectories](https://en.wikipedia.org/wiki/Symplectic_geometry)
            around rotating binary gravitational systems and derived a non-obvious
            [integral of motion](https://en.wikipedia.org/wiki/Constant_of_motion#Integral_of_motion).

      - date: "Aug 2009 | to | Dec 2009"
        title: "Quasicrystals, tilings and diffraction patterns"
        meta: "[Mathematics Senior Thesis](https://www.gvsu.edu/math/), [Grand Valley State University](https://math.gvsu.edu)"
        content:
          - >-
            I studied diffraction patterns of [aperiodic tiles](https://en.wikipedia.org/wiki/Penrose_tiling),
            [quasicrystals](https://en.wikipedia.org/wiki/Quasicrystal), and
            [Golden](https://en.wikipedia.org/wiki/Golden_ratio) and [Silver](https://en.wikipedia.org/wiki/Silver_ratio) ratios.

      - date: "May 2009 | to | Aug 2009"
        title: "Symmetry analysis of differential equations"
        meta: "[Research Experience for Undergraduates](https://www.ucf.edu/), [University of Central Florida](https://www.ucf.edu/)"
        content:
          - >-
            I determined the underlying [Lie symmetries](https://en.wikipedia.org/wiki/Lie_algebra) of the
            [Lane-Emden equation](https://en.wikipedia.org/wiki/Lane%E2%80%93Emden_equation) for generalized polytropic stars.

