baseURL = "https://brege.org"
copyright = "Copyright (c) 2016-2026 Wyatt Brege"
locale = "en"
defaultContentLanguage = "en"
enableRobotsTXT = true
enableInlineShortcodes = true

enableEmoji = true
ignoreFiles = ['(?:^|/)README\.md$']

theme = "gastrophysics"
title = "brege.org"

[frontmatter]
  lastmod = ["lastmod", ":fileModTime"]

[outputs]
  home = [ "HTML", "RSS", "JSON", "LLMS", "LLMSFull" ]

[mediaTypes."text/markdown"]
  suffixes = [ "md" ]

[outputFormats.CVMarkdown]
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true
  notAlternative = false
  rel = "alternate"
  ugly = true

[outputFormats.PageMarkdown]
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true
  notAlternative = false
  rel = "alternate"
  ugly = true

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = false
  rel = "alternate"

[outputFormats.LLMSFull]
  mediaType = "text/plain"
  baseName = "llms-full"
  isPlainText = true
  notAlternative = false
  rel = "alternate"

[params]
  author = "Wyatt Brege"
  # linen, rose-pine, rose-pine-moon, catppuccin-frappe,
  # catppuccin-macchiato, catppuccin-mocha, nord,
  # gruvbox, everforest, sepia, nordic-linen
  #color = 'linen'
  colorLight = 'nordic-linen'
  colorDark = 'nordic-linen'
  env = 'production'
  twitter = ''
  github = 'brege'
  instagram = ''
  mastodon = 'brege@mastodon.social'
  matrix = '@brege:matrix.org'
  signal = '@brege.01'
  avatar = 'wyatt@brege.org'
  name = 'Wyatt Brege'
  bio = 'gastrophysicist'
  description = 'Wyatt Brege publishes essays, recipes, data science projects, software notes, and career context spanning astrophysics, cooking, and applied machine learning.'

  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowShareButtons = true
  ShowReadingTime = false
  ShowWordCount = true
  ShowBreadCrumbs = true
  ShowFullTextinRSS = true
  ShowRssButtonInSectionTermList = true
  hideFooter = true
  seriesOpened = false

  showRelatedPosts = true
  TocOpen = true
  ShowToc = true

  defaultTheme = 'auto' 
  disableScrollToTop = true
  disableAnchorHeadings = false

  mainSections = ['post']
  homePageSize = 6
  postPageSize = 20

  [params.paletteBand]
    enabled = true
    defaultVisible = false
    showToggle = false
    position = 'aboveFooter'

[params.heroCards]
  defaultView = 'expanded'

  [params.heroCards.compact]
    summary = true

  [params.heroCards.expanded]
    summary = true

[params.postCards]
  defaultView = 'compact'

  [params.postCards.compact]
    summary = true

  [params.postCards.expanded]
    summary = true

