[params.llms]
  summary = 'Wyatt Brege publishes essays, recipes, data science projects, software notes, and career context spanning astrophysics, cooking, and applied machine learning.'

[[params.llms.sections]]
  title = 'Profile'
  [[params.llms.sections.links]]
    title = 'About'
    url = '/about/'
    pageRef = 'about'
    description = 'Biographical context for Wyatt Brege, including physics, cooking, data science, and software work.'
  [[params.llms.sections.links]]
    title = 'CV'
    url = '/cv/'
    pageRef = 'cv'
    description = 'Career summary, selected projects, publications, talks, awards, and teaching experience.'
  [[params.llms.sections.links]]
    title = 'Contact'
    url = '/contact/'
    pageRef = 'contact'
    description = 'Preferred contact channels and public identity links.'

[[params.llms.sections]]
  title = 'Writing'
  [[params.llms.sections.links]]
    title = 'Posts'
    url = '/post/'
    pageRef = 'post'
    description = 'Article archive covering data science, software, food, health, and site operations.'
  [[params.llms.sections.links]]
    title = 'What is Pesto?'
    url = '/post/what-is-pesto/'
    pageRef = 'post/what-is-pesto'
    description = 'A culinary taxonomy of pesto and related green sauces.'
  [[params.llms.sections.links]]
    title = 'The Flavor Network'
    url = '/post/the-flavor-network/'
    pageRef = 'post/the-flavor-network'
    description = 'Flavor pairing and recipe discovery using weighted ingredient similarity.'
  [[params.llms.sections.links]]
    title = 'Image Activity'
    url = '/post/image-activity/'
    pageRef = 'post/image-activity'
    description = 'A data exploration of personal camera, screenshot, and image activity.'
  [[params.llms.sections.links]]
    title = 'Email Analysis'
    url = '/post/email-analysis/'
    pageRef = 'post/email-analysis'
    description = 'A personal email history analysis focused on spam, surveys, and message value.'

[[params.llms.sections]]
  title = 'Cooking'
  [[params.llms.sections.links]]
    title = 'Recipes'
    url = '/recipes/'
    pageRef = 'recipes'
    description = 'Professional, heirloom, and personal recipes.'
  [[params.llms.sections.links]]
    title = 'Tasting Menus'
    url = '/menus/'
    pageRef = 'menus'
    description = 'Farmer-focused tasting menus from restaurant work.'
  [[params.llms.sections.links]]
    title = 'Protein Calculator'
    url = '/post/protein-calculator/'
    pageRef = 'post/protein-calculator'
    description = 'A food data calculator for daily protein requirements.'

[[params.llms.sections]]
  title = 'Machine-readable'
  [[params.llms.sections.links]]
    title = 'Sitemap'
    url = '/sitemap.xml'
    description = 'XML sitemap for canonical crawl targets.'
  [[params.llms.sections.links]]
    title = 'RSS'
    url = '/index.xml'
    description = 'Full-text RSS feed for recent public content.'
  [[params.llms.sections.links]]
    title = 'Search JSON'
    url = '/index.json'
    description = 'Plain text search index with titles, summaries, URLs, and page content.'

# needed to  render raw HTML (e.g. <sub>, <sup>, <kbd>, <mark>)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    ordered = true
    startLevel = 1
    endLevel = 4

