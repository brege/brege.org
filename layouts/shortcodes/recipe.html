<style>
  .recipe {
    margin: 2rem auto 0;
    max-width: 760px;
    padding: 0;
  }

  .recipe .content > h2:first-child {
    display: none;
  }

  .recipe .content > p:has(strong) {
    display: flex;
    align-items: baseline;
    gap: 0.45rem;
    margin: 0 0 0.45rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78em;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--secondary);
  }

  .recipe .content > p:has(strong) strong {
    flex: 0 0 auto;
    font-weight: 500;
    color: var(--primary);
  }

  .recipe .content > p:nth-of-type(3) {
    margin: 0.8rem 0 1.6rem;
    max-width: 42rem;
    color: var(--secondary);
    font-style: italic;
  }

  .recipe .content h3 {
    margin: 2rem 0 0.9rem;
    padding-top: 0.9rem;
    border-top: 1px solid var(--border);
    font-size: 1.15rem;
    letter-spacing: 0.04em;
    text-transform: none;
  }

  .recipe .content h4 {
    margin: 1rem 0 0.45rem;
    font-size: 1em;
    letter-spacing: 0.04em;
    color: var(--secondary);
  }

  .recipe .content ul,
  .recipe .content ol {
    margin: 0;
    padding-left: 1.35rem;
  }

  .recipe .content ul li,
  .recipe .content ol li {
    margin: 0.45rem 0;
    line-height: 1.6;
  }

  .recipe .content > h3 + p,
  .recipe .content > h3 + p + p,
  .recipe .content > h3 + p + p + p,
  .recipe .content > h3 + p + p + p + p,
  .recipe .content > h3 + p + p + p + p + p,
  .recipe .content > h3 + p + p + p + p + p + p,
  .recipe .content > h3 + p + p + p + p + p + p + p,
  .recipe .content > h3 + p + p + p + p + p + p + p + p,
  .recipe .content > h3 + p + p + p + p + p + p + p + p + p,
  .recipe .content > h3 + p + p + p + p + p + p + p + p + p + p {
    max-width: 44rem;
    margin: 0.9rem 0;
  }

  .recipe .content em {
    color: var(--secondary);
  }

  @media (max-width: 700px) {
    .recipe {
      margin-top: 1.5rem;
    }

    .recipe .content > p:has(strong) {
      margin-right: 0;
    }
  }
</style>

<div class="recipe border rounded">
  <div class="content">
    {{ .Inner }}
  </div>
</div>
