{{ $depth := .Page.Params.navDepth | default 2 }}
<script>
document.addEventListener('DOMContentLoaded', function() {
  var depth = {{ $depth }};
  var selector = Array.from({length: depth}, function(_, i) {
    return 'h' + (i + 2) + '[id]';
  }).join(', ');
  var sections = null;
  var lastJump = -1;

  function getSections() {
    if (!sections) sections = Array.from(document.querySelectorAll(selector));
    return sections;
  }

  function nearest() {
    var s = getSections();
    var y = window.scrollY + 80;
    var best = 0;
    for (var i = 0; i < s.length; i++) {
      if (s[i].offsetTop <= y) best = i;
    }
    return best;
  }

  function jump(idx) {
    var s = getSections();
    if (!s.length) return;
    if (idx < 0) idx = 0;
    if (idx >= s.length) idx = s.length - 1;
    lastJump = idx;
    s[idx].scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  window.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    var forward = (e.key === 'Enter' && !e.shiftKey) || e.key === ' ';
    var backward = e.key === 'Backspace' || (e.key === 'Enter' && e.shiftKey);

    if (!forward && !backward) return;

    e.preventDefault();
    e.stopPropagation();

    var cur = nearest();

    if (forward) {
      jump(cur + 1);
    } else {
      // if we're at the section we last jumped to, go one before it
      // otherwise nearest() might return the same section we're visually at
      if (lastJump >= 0 && cur >= lastJump) {
        jump(lastJump - 1);
      } else {
        jump(cur - 1);
      }
    }

    return false;
  }, true);
});
</script>
