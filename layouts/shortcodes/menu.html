<style>
  .menu-card {
    position: relative;
    margin-bottom: var(--gap);
    padding: 2.5rem 2rem;
    background: var(--code-bg);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
    text-align: center;
  }

  .menu-card h2 {
    font-size: 2rem;
    font-weight: 300;
    color: var(--primary);
    margin-bottom: 1.2rem;
    padding-bottom: 1.2rem;
    border-bottom: 1px solid var(--border);
  }

  .menu-card h3 {
    font-family: var(--font-serif-display);
    font-size: 1.3rem;
    font-weight: 300;
    color: var(--primary);
    margin-top: 2rem;
    margin-bottom: 0.55rem;
    border-bottom: none;
    padding-bottom: 0;
  }

  .menu-card .anchor,
  .menu-card h1:hover .anchor,
  .menu-card h2:hover .anchor,
  .menu-card h3:hover .anchor,
  .menu-card h4:hover .anchor,
  .menu-card h5:hover .anchor,
  .menu-card h6:hover .anchor {
    display: none !important;
  }

  .menu-card .menu-items {
    font-size: 1rem;
    color: var(--secondary);
    line-height: 1.8;
  }

  .menu-card .menu-items p {
    color: var(--secondary);
    font-size: 0.9em;
    line-height: 1.75;
    font-style: italic;
    max-width: 400px;
    margin: 0.45rem auto;
  }

  .menu-card .menu-items p em {
    font-size: 0.85em;
    opacity: 0.6;
  }

  .menu-card .menu-footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.82em;
    color: var(--secondary);
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
  }

  .menu-card .menu-footer .menu-date {
    font-style: italic;
  }

  .menu-card .menu-footer .menu-author {
    font-variant: small-caps;
    letter-spacing: 0.5px;
  }
</style>

<div class="menu-card">
  <div class="menu-items">
    {{ .Inner }}
  </div>

  {{- $dateFormatted := .Page.Date | time | dateFormat "January 2, 2006" -}}
  {{- $rawDate := .Page.Date | time.Format "2006-01-02" -}}
  {{- $rest := replace .Page.Title (print $rawDate " ") "" -}}

  <div class="menu-footer">
    <div class="menu-date">
      <span>{{ $dateFormatted }} &mdash; {{ $rest }}</span>
    </div>
    <div class="menu-author">
      <span>Chef Wyatt Brege</span>
    </div>
  </div>
</div>
